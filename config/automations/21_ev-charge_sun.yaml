- id: ev_charge_stop_on_enable_off 
  alias: "EV charge stop when enable off"
  trigger:
    - platform: state
      entity_id: input_boolean.ev_charge_enable
      to: "off"
  condition:
    - condition: state
      entity_id: switch.ev_charger
      state: "on"
  action:
    - service: switch.turn_off
      target:
        entity_id: switch.ev_charger

- id: ev_charge_on_export_sun
  alias: "EV charge on export"
  mode: restart

  trigger:
    - id: start
      platform: numeric_state
      entity_id: sensor.shelly_phase_a_power_smoothed
      below: -2500
      for: "00:01:00"

    - id: stop
      platform: numeric_state
      entity_id: sensor.shelly_phase_a_power_smoothed
      above: 500
      for: "00:05:00"

  action:
    - choose:
        # START
        - conditions:
            - condition: trigger
              id: start
            - condition: state
              entity_id: binary_sensor.ev_charger_connectivity
              state: "on"
            - condition: state
              entity_id: input_boolean.ev_charge_enable
              state: "on"
            - condition: state
              entity_id: switch.ev_charger
              state: "off"
          sequence:
            - service: number.set_value
              target:
                entity_id: number.ev_charger_charging_current
              data:
                value: 10

            - delay: "00:00:05"

            - service: switch.turn_on
              target:
                entity_id: switch.ev_charger

            - service: notify.mobile_app_fcp_n49
              data:
                title: "EV: Carregamento SOLAR INICIADO"
                message: >-
                  Exportação: {{ states('sensor.shelly_phase_a_power_smoothed') }} W |
                  Corrente: 10 A |
                  Hora: {{ now().strftime('%H:%M') }}

        # STOP
        - conditions:
            - condition: trigger
              id: stop
            - condition: state
              entity_id: switch.ev_charger
              state: "on"
          sequence:
            - service: switch.turn_off
              target:
                entity_id: switch.ev_charger

            - service: notify.mobile_app_fcp_n49
              data:
                title: "EV: Carregamento SOLAR PARADO"
                message: >-
                  Potência rede: {{ states('sensor.shelly_phase_a_power_smoothed') }} W |
                  Hora: {{ now().strftime('%H:%M') }}