# ============================================================================
# NIGHT: Charge SolarFlow from grid when today's PV forecast is low
# Plan anytime (sets helper), act only 00:30–07:00 (touches inverter)
# Helper used by automation 11: input_boolean.solarflow_night_charge_planned
#
# 23:00–00:30: explicit idle enforcement (handoff gap after automation 11
# stops at 23:00 and before this automation's own acting window starts).
# Moved the acting window start from 02:00 to 00:30 — the weather forecast
# sensor doesn't need to wait until 02:00 to be accurate enough to act on.
# ============================================================================

- id: solarflow_night_charge_low_pv_forecast
  alias: "SolarFlow – Plan/Charge on Low PV Forecast (plan anytime; idle 23:00–00:30; charge 00:30–07:00)"
  description: >
    Plans grid charge by setting input_boolean.solarflow_night_charge_planned anytime.
    Forces idle during 23:00–00:30 (handoff gap from automation 11).
    Actually charges SolarFlow from the grid at 600 W only during 00:30–07:00 when
    PV forecast is low and SoC is below the configured limit.
  mode: restart

  trigger:
    - platform: time_pattern
      minutes: "/1"
      id: planning_periodic

    # Fast reaction to other night loads changing the available headroom
    - platform: state
      entity_id: sensor.shelly_phase_a_power_smoothed
      for: "00:00:05"
      id: grid_change

    # Force a plan refresh shortly before the acting window opens
    - platform: time
      at: "00:20:00"
      id: pre_cutoff_plan

    - platform: state
      entity_id:
        - sensor.solarflow_800_pro_electric_level
        - sensor.solarflow_800_pro_2_electric_level
      for: "00:00:20"
      id: soc_change

    # Hard edge: start of the 23:00–00:30 idle handoff window
    - platform: time
      at: "23:00:00"
      id: idle_window_start

    - platform: time
      at: "00:30:00"
      id: window_start

    - platform: time
      at: "07:00:00"
      id: window_end_check

    - platform: homeassistant
      event: start
      id: ha_startup

  # No global time condition: we want the helper to update before 02:00.
  condition:
    - condition: template
      value_template: >
        {{ states('sensor.solarflow_800_pro_electric_level')
           not in ['unknown','unavailable'] }}

    - condition: template
      value_template: >
        {{ states('number.solarflow_800_pro_output_limit')
           not in ['unknown','unavailable']
           and states('number.solarflow_800_pro_input_limit')
           not in ['unknown','unavailable'] }}

  action:
    # Clear the plan flag at the window end
    - if:
        - condition: trigger
          id: window_end_check
      then:
        - service: input_boolean.turn_off
          target:
            entity_id: input_boolean.solarflow_night_charge_planned
        - stop: "Window ended; cleared planned flag"

    - variables:
        soc: >-
          {{ ((states('sensor.solarflow_800_pro_electric_level') | float(0)) +
              (states('sensor.solarflow_800_pro_2_electric_level') | float(0))) / 2 }}
        last_charge: "{{ states('input_number.solarflow_charge_last') | float(0) | int }}"
        max_charge_power: 2000
        # Ceiling kept well under the EV's 4300W stop threshold (and the 4400W
        # breaker guard) so SolarFlow leaves real margin at steady state while
        # both it and the EV are drawing from the grid overnight.
        grid_ceiling: 4000
        grid_headroom: >-
          {{ [0, (grid_ceiling - (states('sensor.shelly_phase_a_power_smoothed') | float(0))) | int] | max }}
        safe_charge_power: "{{ [max_charge_power | int, grid_headroom | int] | min }}"

        # --- ramp control: move toward the headroom-based target gradually
        # instead of jumping straight to it. Ramp down faster than up since
        # backing off is the safety-relevant direction (another load grabbed
        # the headroom); automation 15 remains the hard backstop regardless.
        ramp_up_step: 200
        ramp_down_step: 600
        target_charge: >-
          {% set prev = last_charge %}
          {% set desired = safe_charge_power | int %}
          {% if prev == 0 %}
            {{ desired }}
          {% elif desired >= prev %}
            {{ [desired, prev + ramp_up_step] | min }}
          {% else %}
            {{ [desired, prev - ramp_down_step] | max }}
          {% endif %}

        low_pv_soc_limit: "{{ states('input_number.solarflow_low_pv_soc_limit') | float(45) }}"

        # Use today's forecast (because after midnight it's already 'today')
        pv_today_kwh: "{{ states('sensor.solar_production_estimate_today_total') | float(0) }}"
        pv_threshold_kwh: "{{ states('input_number.solarflow_pv_threshold_kwh') | float(5) }}"

        pv_forecast_available: >-
          {{ states('sensor.solar_production_estimate_today_total')
             not in ['unknown','unavailable','none',''] }}

        # Decision: should we charge tonight due to low PV forecast?
        should_charge_low_pv: >-
          {{ pv_forecast_available
             and (pv_today_kwh < pv_threshold_kwh)
             and soc < 70
             and (soc < low_pv_soc_limit or last_charge > 0) }}

    # Update the helper used by automation 11.
    # Safety: only update if forecast is available; otherwise keep previous value.
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ pv_forecast_available }}"
          sequence:
            - service: "input_boolean.turn_{{ 'on' if should_charge_low_pv else 'off' }}"
              target:
                entity_id: input_boolean.solarflow_night_charge_planned
      default: []

    - choose:
        # 0) Explicit idle enforcement for the 23:00–00:30 handoff gap
        #    (automation 11 stops acting at 23:00; this automation's own
        #    acting window doesn't open until 00:30).
        - conditions:
            - condition: time
              after: "23:00:00"
              before: "00:30:00"
          sequence:
            - if:
                - condition: template
                  value_template: >
                    {{ (last_charge | int) != 0 or (states('input_number.solarflow_discharge_last') | float(0) | int) != 0 }}
              then:
                - service: number.set_value
                  target:
                    entity_id:
                      - number.solarflow_800_pro_output_limit
                      - number.solarflow_800_pro_input_limit
                      - number.solarflow_800_pro_2_output_limit
                      - number.solarflow_800_pro_2_input_limit
                  data:
                    value: 0
                  continue_on_error: true

                - service: input_number.set_value
                  target:
                    entity_id:
                      - input_number.solarflow_discharge_last
                      - input_number.solarflow_charge_last
                  data:
                    value: 0

                - service: system_log.write
                  data:
                    level: debug
                    logger: solarflow_grid_control
                    message: >
                      "🌙 HANDOFF IDLE (23:00–00:30): Discharge=0W, Charge=0W. Trigger: {{ trigger.id }}"
            - stop: "Idle handoff window (23:00–00:30)"

        # A) Plan-only outside the window (don’t touch inverter)
        - conditions:
            - condition: time
              before: "00:30:00"
          sequence:
            - stop: "Planning only (before 00:30)"

        - conditions:
            - condition: time
              after: "07:00:00"
          sequence:
            - stop: "Planning only (after 07:00)"

        # B) In-window charge when planned and grid headroom allows (22:00–08:00 low tariff)
        - conditions:
            - condition: or
              conditions:
                - condition: time
                  after: "22:00:00"
                - condition: time
                  before: "08:00:00"
            - condition: template
              value_template: "{{ should_charge_low_pv }}"
            - condition: template
              value_template: "{{ safe_charge_power >= 200 }}"
          sequence:
            - service: select.select_option
              target:
                entity_id:
                  - select.solarflow_800_pro_ac_mode
                  - select.solarflow_800_pro_2_ac_mode
              data:
                option: "input"
              continue_on_error: true

            - service: number.set_value
              target:
                entity_id:
                  - number.solarflow_800_pro_output_limit
                  - number.solarflow_800_pro_2_output_limit
              data:
                value: 0
              continue_on_error: true

            - service: number.set_value
              target:
                entity_id:
                  - number.solarflow_800_pro_input_limit
                  - number.solarflow_800_pro_2_input_limit
              data:
                value: "{{ (target_charge / 2) | int }}"
              continue_on_error: true

            - service: input_number.set_value
              target:
                entity_id: input_number.solarflow_discharge_last
              data:
                value: 0

            - service: input_number.set_value
              target:
                entity_id: input_number.solarflow_charge_last
              data:
                value: "{{ target_charge | int }}"

            - service: system_log.write
              data:
                level: debug
                logger: solarflow_grid_control
                message: >
                  🌙 CHARGE (LOW PV): target={{ target_charge }}W (desired={{ safe_charge_power }}W,
                  headroom={{ grid_headroom }}W) | soc={{ soc }}%
                  | pv_today={{ pv_today_kwh }}kWh | threshold={{ pv_threshold_kwh }}kWh
                  | planned={{ is_state('input_boolean.solarflow_night_charge_planned','on') }}

      default:
        # In-window but not charging: if we were charging before, stop/idle
        - condition: or
          conditions:
            - condition: time
              after: "22:00:00"
            - condition: time
              before: "08:00:00"
        - condition: template
          value_template: "{{ (last_charge | int) != 0 }}"

        - service: select.select_option
          target:
            entity_id:
              - select.solarflow_800_pro_ac_mode
              - select.solarflow_800_pro_2_ac_mode
          data:
            option: "output"
          continue_on_error: true

        - service: number.set_value
          target:
            entity_id:
              - number.solarflow_800_pro_output_limit
              - number.solarflow_800_pro_input_limit
              - number.solarflow_800_pro_2_output_limit
              - number.solarflow_800_pro_2_input_limit
          data:
            value: 0
          continue_on_error: true

        - service: input_number.set_value
          target:
            entity_id:
              - input_number.solarflow_discharge_last
              - input_number.solarflow_charge_last
          data:
            value: 0

        - service: system_log.write
          data:
            level: debug
            logger: solarflow_grid_control
            message: >
              🛑 WINDOW IDLE: soc={{ soc }}% (conditions not met)
              | planned={{ is_state('input_boolean.solarflow_night_charge_planned','on') }}
