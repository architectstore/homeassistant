# Shared planning signals for automations 11 (day grid-zero) and 12 (night plan).
#
# Forecast used = the day the batteries have to cover:
#   00:00-12:00 -> today's total, 12:00-24:00 -> tomorrow's total.
# Expected high-tariff consumption is derived from the maximum forecast
# temperature for that same day. The manual helper is the safe fallback when
# weather data is unavailable.
# Energy needed from the batteries (kWh) = daily consumption in HIGH-tariff hours
#   minus the part of the PV forecast that is actually usable (60 %).
# Target SoC = discharge floor + need / 7.68 kWh (2 x 3.84), clamped to the
#   floor..charge-max range (charge-max is managed by automation 14).
- sensor:
    - name: "SolarFlow planned high-tariff consumption"
      unique_id: solarflow_planned_high_tariff_consumption_kwh
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: measurement
      icon: mdi:home-thermometer
      availability: >-
        {% set weather_entity = 'sensor.today_weather_forecast'
                                if now().hour < 12 else
                                'sensor.tomorrow_weather_forecast' %}
        {{ is_number(state_attr(weather_entity, 'temperature'))
           or is_number(states('input_number.solarflow_daily_consumption_kwh')) }}
      state: >-
        {% set weather_entity = 'sensor.today_weather_forecast'
                                if now().hour < 12 else
                                'sensor.tomorrow_weather_forecast' %}
        {% set temperature = state_attr(weather_entity, 'temperature') %}
        {% if is_number(temperature) %}
          {% set maximum = temperature | float %}
          {{ 4 if maximum >= 18 else 6 if maximum >= 16 else 7 if maximum >= 14 else 10 }}
        {% else %}
          {{ states('input_number.solarflow_daily_consumption_kwh') | float(5) }}
        {% endif %}
      attributes:
        forecast_temperature: >-
          {% set weather_entity = 'sensor.today_weather_forecast'
                                  if now().hour < 12 else
                                  'sensor.tomorrow_weather_forecast' %}
          {{ state_attr(weather_entity, 'temperature') }}
        forecast_day: "{{ 'today' if now().hour < 12 else 'tomorrow' }}"
        source_entity: >-
          {{ 'sensor.today_weather_forecast' if now().hour < 12 else
             'sensor.tomorrow_weather_forecast' }}
        source: >-
          {% set weather_entity = 'sensor.today_weather_forecast'
                                  if now().hour < 12 else
                                  'sensor.tomorrow_weather_forecast' %}
          {{ 'weather' if is_number(state_attr(weather_entity, 'temperature'))
             else 'manual_fallback' }}

    - name: "SolarFlow night target SoC"
      unique_id: solarflow_night_target_soc
      unit_of_measurement: "%"
      state_class: measurement
      icon: mdi:battery-charging-high
      availability: >-
        {# Freshness is judged on ALL FOUR source forecast sensors' last_reported
           (bumps on every integration refresh, even when the value is unchanged).
           last_updated on the derived total only moves when the value changes,
           so it would wrongly expire on a stable overnight forecast. #}
        {% set fc_entity = 'sensor.solar_production_estimate_today_total'
                           if now().hour < 12 else
                           'sensor.solar_production_estimate_tomorrow_total' %}
        {% set base = 'sensor.energy_production_today'
                      if now().hour < 12 else
                      'sensor.energy_production_tomorrow' %}
        {% set srcs = [base, base ~ '_2', base ~ '_3', base ~ '_4'] %}
        {# Oldest of the four sources decides: one stalled source is enough
           to make the summed total unreliable. #}
        {% set ns = namespace(oldest=0, ok=true) %}
        {% for e in srcs %}
          {% set s = states[e] %}
          {% if s is none %}
            {% set ns.ok = false %}
          {% else %}
            {% set age = as_timestamp(now()) - as_timestamp(s.last_reported or s.last_updated) %}
            {% set ns.oldest = [ns.oldest, age] | max %}
          {% endif %}
        {% endfor %}
        {% set fc_fresh = ns.ok and ns.oldest < 6 * 3600 %}
        {{ is_number(states(fc_entity)) and fc_fresh
           and is_number(states('sensor.solarflow_planned_high_tariff_consumption_kwh')) }}
      state: >-
        {% set fc = states('sensor.solar_production_estimate_today_total'
                           if now().hour < 12 else
                           'sensor.solar_production_estimate_tomorrow_total') | float(0) %}
        {% set use = states('sensor.solarflow_planned_high_tariff_consumption_kwh') | float(5) %}
        {% set floor = states('input_number.solarflow_soc_discharge_min') | float(25) %}
        {% set cap = states('input_number.solarflow_soc_charge_max') | float(90) %}
        {% set need = use - 0.6 * fc %}
        {% set target = floor + (need / 7.68) * 100 %}
        {{ [[target, floor] | max, cap] | min | round(0) }}

- binary_sensor:
    - name: "SolarFlow low PV day"
      unique_id: solarflow_low_pv_day
      icon: mdi:weather-cloudy
      availability: "{{ has_value('sensor.solarflow_night_target_soc') }}"
      # On when the forecast leaves > ~10 % SoC (~0.8 kWh) to be bought at night tariff
      state: >-
        {{ states('sensor.solarflow_night_target_soc') | float(0)
           > states('input_number.solarflow_soc_discharge_min') | float(25) + 10 }}
