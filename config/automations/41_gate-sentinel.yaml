- id: sentinel_alert_gate_or
  alias: Sentinel - Alert on gate or occupancy
  description: Notify phone when sentinel is on and gate opens or occupancy is detected
  mode: single

  trigger:
    - platform: state
      entity_id: binary_sensor.gate_sensor_garage
      to: "on"
      id: gate

    - platform: state
      entity_id: binary_sensor.motion_entrance
      to: "on"
      id: entrance

    - platform: state
      entity_id: binary_sensor.motion_garage
      to: "on"
      id: garage

  condition:
    - condition: state
      entity_id: input_boolean.gate_sentinel
      state: "on"

  action:
    - service: notify.mobile_app_v5
      data:
        title: "Sentinel alert"
        message: >-
          {% if trigger.id == 'gate' %}
            Garage gate opened.
          {% elif trigger.id == 'entrance' %}
            Occupancy detected at entrance.
          {% elif trigger.id == 'garage' %}
            Occupancy detected in garage.
          {% else %}
            Triggered by {{ trigger.to_state.name if trigger.to_state else trigger.entity_id }}.
          {% endif %}
        data:
          tag: sentinel_alert
          ttl: 0
          priority: high

- id: sentinel_sync_blink
  alias: Sentinel - Sync Blink with helper
  description: Arm or disarm Blink immediately when Gate Sentinel is toggled
  mode: single

  trigger:
    - platform: state
      entity_id: input_boolean.gate_sentinel

  action:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.gate_sentinel
              state: "on"
          sequence:
            - service: alarm_control_panel.alarm_arm_away
              target:
                entity_id: alarm_control_panel.blink_queijas_home

            - service: notify.mobile_app_v5
              data:
                title: "Sentinel ARMADO"
                message: >-
                  Gate Sentinel ligado às {{ now().strftime('%H:%M') }}.
                data:
                  tag: sentinel_state
                  ttl: 0
                  priority: high

        - conditions:
            - condition: state
              entity_id: input_boolean.gate_sentinel
              state: "off"
          sequence:
            - service: alarm_control_panel.alarm_disarm
              target:
                entity_id: alarm_control_panel.blink_queijas_home

            - service: notify.mobile_app_v5
              data:
                title: "Sentinel DESARMADO"
                message: >-
                  Gate Sentinel desligado às {{ now().strftime('%H:%M') }}.
                data:
                  tag: sentinel_state
                  ttl: 0
                  priority: high

- id: sentinel_auto_on_phone_away
  alias: Sentinel - Auto arm/disarm on phone Wi-Fi presence
  description: Turns Gate Sentinel on 5 min after both phones leave home Wi-Fi, off as soon as either reconnects
  mode: single

  trigger:
    - platform: state
      entity_id:
        - device_tracker.honor_2
        - device_tracker.sonia_s_a56
      to: "not_home"
      for:
        minutes: 5
      id: away

    - platform: state
      entity_id:
        - device_tracker.honor_2
        - device_tracker.sonia_s_a56
      to: "home"
      id: home

  condition: []

  action:
    - choose:
        - conditions:
            - condition: trigger
              id: away
            - condition: state
              entity_id: device_tracker.honor_2
              state: "not_home"
            - condition: state
              entity_id: device_tracker.sonia_s_a56
              state: "not_home"
          sequence:
            - service: input_boolean.turn_on
              target:
                entity_id: input_boolean.gate_sentinel

        - conditions:
            - condition: trigger
              id: home
          sequence:
            - service: input_boolean.turn_off
              target:
                entity_id: input_boolean.gate_sentinel

- id: sentinel_blink_watchdog
  alias: Sentinel - Re-arm Blink every 30 min
  description: Re-arms Blink if Sentinel is enabled and Blink was disarmed externally
  mode: single

  trigger:
    - platform: time_pattern
      minutes: "/30"
    - platform: homeassistant
      event: start

  condition:
    - condition: state
      entity_id: input_boolean.gate_sentinel
      state: "on"

    - condition: not
      conditions:
        - condition: state
          entity_id: alarm_control_panel.blink_queijas_home
          state: "armed_away"

  action:
    - service: alarm_control_panel.alarm_arm_away
      target:
        entity_id: alarm_control_panel.blink_queijas_home