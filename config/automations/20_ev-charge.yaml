- id: ev_charge_stop_on_enable_off
  alias: "EV charge stop when enable off"
  description: "Stops EV charging immediately when master EV charge enable is turned off"
  mode: single

  trigger:
    - platform: state
      entity_id: input_boolean.ev_charge_enable
      to: "off"

  condition:
    - condition: state
      entity_id: switch.ev_charger
      state: "on"

  action:
    - service: switch.turn_off
      target:
        entity_id: switch.ev_charger

    - service: notify.mobile_app_v5
      data:
        title: "EV: Carregamento PARADO manualmente"
        message: >-
          EV Charge Enable desligado às {{ now().strftime('%H:%M') }}

- id: 'ev_charger_night_schedule'
  alias: "EV Charger - Night Schedule (Safe Grid)"
  description: "Liga 22h-8h só se rede <2000W; para se rede >4900W durante 15 min (a qualquer hora) ou às 8h"
  mode: restart

  trigger:
    # Retry automático em mudanças relevantes
    - platform: state
      entity_id:
        - binary_sensor.grid_low_safe_for_ev
        - binary_sensor.grid_high_alert_ev
        - binary_sensor.ev_charger_connectivity
        - binary_sensor.ev_charger_problem
        - input_boolean.ev_charge_enable

    # Avalia o início do período noturno mesmo se nenhum sensor mudar
    - platform: time
      at: "22:00:00"
      id: 'night_on'

    # Parada horário
    - platform: time
      at: "08:00:00"
      id: 'morning_off'

    # Failsafe de sobrecarga: rede >4900W durante 15 min (qualquer hora, qualquer causa)
    - platform: state
      entity_id: binary_sensor.grid_high_alert_ev
      to: "on"
      for: "00:15:00"
      id: 'overload'

  action:
    - choose:
        # 1. LIGA: horário noite + rede baixa + charger pronto + enable on
        - conditions:
            - condition: time
              after: "22:00:00"
              before: "08:00:00"
            - condition: state
              entity_id: input_boolean.ev_charge_enable
              state: "on"
            - condition: state
              entity_id: binary_sensor.grid_low_safe_for_ev
              state: "on"
              for:
                seconds: 5
            - condition: state
              entity_id: switch.ev_charger
              state: "off"
            - condition: state
              entity_id: binary_sensor.ev_charger_connectivity
              state: "on"
            - condition: state
              entity_id: binary_sensor.ev_charger_problem
              state: "off"
          sequence:
            - service: number.set_value
              target:
                entity_id: number.ev_charger_charging_current
              data:
                value: 13

            - delay: "00:00:05"

            - service: switch.turn_on
              target:
                entity_id: switch.ev_charger

            - service: notify.mobile_app_v5
              data:
                title: "EV: Carregamento INICIADO (Seguro)"
                message: >-
                  Fase A: {{ states('sensor.shelly_phase_a_power_smoothed') }} W (<2000W) |
                  Corrente: 13 A |
                  Hora: {{ now().strftime('%H:%M') }}

        # 2. STOP EMERGÊNCIA: sobrecarga rede (ignora o toggle enable)
        - conditions:
            - condition: state
              entity_id: binary_sensor.grid_high_alert_ev
              state: "on"
              for:
                minutes: 15
            - condition: state
              entity_id: switch.ev_charger
              state: "on"
          sequence:
            - service: switch.turn_off
              target:
                entity_id: switch.ev_charger

            - service: notify.mobile_app_v5
              data:
                title: "🚨 EV: PARADO SOBRECONSUMO!"
                message: >-
                  Fase A: {{ states('sensor.shelly_phase_a_power_smoothed') }} W (>4900W durante 15 min) |
                  Hora: {{ now().strftime('%H:%M') }}

        # 3. STOP HORÁRIO 08:00
        - conditions:
            - condition: trigger
              id: 'morning_off'
            - condition: state
              entity_id: switch.ev_charger
              state: "on"
            - condition: state
              entity_id: input_boolean.ev_charge_enable
              state: "on"
          sequence:
            - service: switch.turn_off
              target:
                entity_id: switch.ev_charger

            - service: notify.mobile_app_v5
              data:
                title: "EV: PARADO Horário"
                message: >-
                  Fim carregamento noturno 08:00 | Hora: {{ now().strftime('%H:%M') }}

  max_exceeded: silent
