# ============================================================================
# LOW-TARIFF NIGHT CHARGE for a low-PV day
#
# Goal: when the forecast for the coming day is too low to refill the batteries,
# fill them during the low tariff (22:00-08:00) to the target SoC computed by
# sensor.solarflow_night_target_soc, so the high-tariff day is covered by the
# batteries instead of the grid.
#
# Ownership (who may touch the inverters) - complementary with automation 11:
#   * 12 owns  23:00-07:00 always
#   * 12 owns  22:00-23:00 and 07:00-08:00 ONLY on a low-PV day
#              (binary_sensor.solarflow_low_pv_day = on)
#   * 11 owns  everything else (07:00-23:00 minus the above)
#
# Within 12's ownership:
#   - before 00:30 : idle (no charge, no discharge)
#   - 00:30-08:00  : charge each battery that is below target, headroom-capped
#                    and ramped; stop each battery when it reaches the target
#   - at 07:00 / 08:00 when handing back to 11: zero limits + helpers
# ============================================================================

- id: solarflow_night_charge_low_pv_forecast
  alias: "SolarFlow – Low-tariff night charge for low-PV day (per-battery target)"
  description: >
    Charges each battery from the grid during 00:30-08:00 up to the forecast-based
    target SoC (sensor.solarflow_night_target_soc) when the next day is a low-PV
    day. Idles 22:00/23:00-00:30. Ramps up gradually and backs off fast when the
    grid import approaches the contract limit.
  mode: restart

  trigger:
    - platform: time_pattern
      minutes: "/1"
      id: periodic

    # Fast back-off when the grid gets close to the contract limit
    - platform: numeric_state
      entity_id: sensor.shelly_phase_a_power_smoothed
      above: 4100
      for: "00:00:05"
      id: overload

    - platform: state
      entity_id:
        - sensor.solarflow_800_pro_electric_level
        - sensor.solarflow_800_pro_2_electric_level
      for: "00:00:20"
      id: soc_change

    - platform: time
      at: "22:00:00"
      id: t_2200
    - platform: time
      at: "23:00:00"
      id: t_2300
    - platform: time
      at: "00:30:00"
      id: window_start
    - platform: time
      at: "07:00:00"
      id: t_0700
    - platform: time
      at: "08:00:00"
      id: t_0800

    - platform: homeassistant
      event: start
      id: ha_startup

  condition:
    - condition: template
      value_template: >
        {{ (has_value('sensor.solarflow_800_pro_electric_level')
            or has_value('sensor.solarflow_800_pro_2_electric_level'))
           and has_value('number.solarflow_800_pro_input_limit')
           and has_value('number.solarflow_800_pro_output_limit') }}

  action:
    - variables:
        # ---------------- tuning ----------------
        grid_ceiling: 4100      # W - kept under breaker guard (4400) and EV stop (4900 x 15 min)
        max_total_charge: 2000
        max_per_device: 1000
        ramp_up_step: 500       # W per ~1 min tick
        ramp_down_step: 1000
        start_hysteresis: 8     # % below target before a (new) charge starts
        min_charge: 100         # W below this the charge is not worth running

        # ---------------- time / ownership ----------------
        t: "{{ now().strftime('%H:%M') }}"
        low_pv_day: "{{ is_state('binary_sensor.solarflow_low_pv_day', 'on') }}"
        owner: >-
          {{ (t >= '23:00' or t < '07:00')
             or ((t >= '22:00' or t < '08:00') and low_pv_day) }}
        in_charge_window: "{{ t >= '00:30' and t < '08:00' }}"

        # ---------------- batteries ----------------
        avail_1: "{{ has_value('sensor.solarflow_800_pro_electric_level') }}"
        avail_2: "{{ has_value('sensor.solarflow_800_pro_2_electric_level') }}"
        soc_1: "{{ states('sensor.solarflow_800_pro_electric_level') | float(100) }}"
        soc_2: "{{ states('sensor.solarflow_800_pro_2_electric_level') | float(100) }}"
        target_ok: "{{ has_value('sensor.solarflow_night_target_soc') }}"
        target_soc: "{{ states('sensor.solarflow_night_target_soc') | float(0) }}"
        planned: "{{ is_state('input_boolean.solarflow_night_charge_planned', 'on') }}"

        # A battery wants charge if clearly below target, or if the plan is
        # already latched on and it has not reached the target yet.
        # (Latch on the planned flag, NOT on last_charge, so a breaker-guard cut
        # or an HA restart cannot silently abort the plan.)
        want_1: >-
          {{ owner and low_pv_day and target_ok and avail_1
             and (soc_1 < target_soc - start_hysteresis or (planned and soc_1 < target_soc)) }}
        want_2: >-
          {{ owner and low_pv_day and target_ok and avail_2
             and (soc_2 < target_soc - start_hysteresis or (planned and soc_2 < target_soc)) }}
        want_any: "{{ want_1 or want_2 }}"
        n_want: "{{ (1 if want_1 else 0) + (1 if want_2 else 0) }}"

        # ---------------- power ----------------
        last_charge: "{{ states('input_number.solarflow_charge_last') | float(0) | int }}"
        last_discharge: "{{ states('input_number.solarflow_discharge_last') | float(0) | int }}"
        grid: "{{ states('sensor.shelly_phase_a_power_smoothed') | float(0) }}"
        # grid already contains our own charging, so headroom is ADDED to the
        # current charge (not used as the absolute charge power).
        grid_headroom: "{{ (grid_ceiling - grid) | int }}"
        desired_total: >-
          {{ [[last_charge + grid_headroom, 0] | max,
              [max_total_charge, max_per_device * n_want] | min] | min }}
        target_total: >-
          {% if last_charge == 0 %}{{ desired_total }}
          {% elif desired_total >= last_charge %}{{ [desired_total, last_charge + ramp_up_step] | min }}
          {% else %}{{ [desired_total, last_charge - ramp_down_step] | max }}
          {% endif %}
        charge_each: >-
          {{ ([target_total / n_want, max_per_device] | min) | round(0) | int if n_want > 0 else 0 }}
        c1: "{{ charge_each if want_1 else 0 }}"
        c2: "{{ charge_each if want_2 else 0 }}"
        total_applied: "{{ c1 + c2 }}"

    # ------------------------------------------------------------------
    # Keep the plan flag in sync (informational + latch for hysteresis).
    # Only meaningful during the low-tariff period.
    # ------------------------------------------------------------------
    - service: "input_boolean.turn_{{ 'on' if want_any else 'off' }}"
      target:
        entity_id: input_boolean.solarflow_night_charge_planned

    - choose:
        # 0) Hand-over back to automation 11 (07:00 / 08:00): clean slate
        - conditions:
            - condition: template
              value_template: "{{ trigger.id in ['t_0700', 't_0800'] and not owner }}"
          sequence:
            - service: input_boolean.turn_off
              target:
                entity_id: input_boolean.solarflow_night_charge_planned
            - if:
                - condition: template
                  value_template: "{{ last_charge != 0 or last_discharge != 0 }}"
              then:
                - service: number.set_value
                  target:
                    entity_id:
                      - number.solarflow_800_pro_output_limit
                      - number.solarflow_800_pro_input_limit
                      - number.solarflow_800_pro_2_output_limit
                      - number.solarflow_800_pro_2_input_limit
                  data:
                    value: 0
                  continue_on_error: true
                - service: input_number.set_value
                  target:
                    entity_id:
                      - input_number.solarflow_discharge_last
                      - input_number.solarflow_charge_last
                  data:
                    value: 0
            - stop: "Hand-over to automation 11"

        # 1) Not ours: automation 11 is in charge
        - conditions:
            - condition: template
              value_template: "{{ not owner }}"
          sequence:
            - stop: "Automation 11 owns this period"

        # 2) Ours but before 00:30: idle both directions
        - conditions:
            - condition: template
              value_template: "{{ not in_charge_window }}"
          sequence:
            - if:
                - condition: template
                  value_template: "{{ last_charge != 0 or last_discharge != 0 }}"
              then:
                - service: number.set_value
                  target:
                    entity_id:
                      - number.solarflow_800_pro_output_limit
                      - number.solarflow_800_pro_input_limit
                      - number.solarflow_800_pro_2_output_limit
                      - number.solarflow_800_pro_2_input_limit
                  data:
                    value: 0
                  continue_on_error: true
                - service: input_number.set_value
                  target:
                    entity_id:
                      - input_number.solarflow_discharge_last
                      - input_number.solarflow_charge_last
                  data:
                    value: 0
            - stop: "Idle until 00:30"

        # 3) Charge the batteries that are below target
        - conditions:
            - condition: template
              value_template: "{{ want_any and total_applied >= min_charge }}"
          sequence:
            - service: select.select_option
              target:
                entity_id:
                  - select.solarflow_800_pro_ac_mode
                  - select.solarflow_800_pro_2_ac_mode
              data:
                option: "input"
              continue_on_error: true
            - service: number.set_value
              target:
                entity_id:
                  - number.solarflow_800_pro_output_limit
                  - number.solarflow_800_pro_2_output_limit
              data:
                value: 0
              continue_on_error: true
            - service: number.set_value
              target:
                entity_id: number.solarflow_800_pro_input_limit
              data:
                value: "{{ c1 }}"
              continue_on_error: true
            - service: number.set_value
              target:
                entity_id: number.solarflow_800_pro_2_input_limit
              data:
                value: "{{ c2 }}"
              continue_on_error: true
            - service: input_number.set_value
              target:
                entity_id: input_number.solarflow_discharge_last
              data:
                value: 0
            - service: input_number.set_value
              target:
                entity_id: input_number.solarflow_charge_last
              data:
                value: "{{ total_applied }}"
            - service: system_log.write
              data:
                level: info
                logger: solarflow_grid_control
                message: >
                  NIGHTCHARGE total={{ total_applied }}W (b1={{ c1 }} b2={{ c2 }})
                  soc={{ soc_1 }}/{{ soc_2 }}% target={{ target_soc }}%
                  grid={{ grid }}W headroom={{ grid_headroom }}W trigger={{ trigger.id }}

      default:
        # In our window, nothing (more) to charge: idle if anything is still set
        - condition: template
          value_template: "{{ last_charge != 0 or last_discharge != 0 }}"
        - service: number.set_value
          target:
            entity_id:
              - number.solarflow_800_pro_output_limit
              - number.solarflow_800_pro_input_limit
              - number.solarflow_800_pro_2_output_limit
              - number.solarflow_800_pro_2_input_limit
          data:
            value: 0
          continue_on_error: true
        - service: input_number.set_value
          target:
            entity_id:
              - input_number.solarflow_discharge_last
              - input_number.solarflow_charge_last
          data:
            value: 0
        - service: system_log.write
          data:
            level: info
            logger: solarflow_grid_control
            message: >
              NIGHTCHARGE idle: soc={{ soc_1 }}/{{ soc_2 }}% target={{ target_soc }}%
              low_pv_day={{ low_pv_day }} headroom={{ grid_headroom }}W trigger={{ trigger.id }}
