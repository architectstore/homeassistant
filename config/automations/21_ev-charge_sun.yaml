- id: ev_charge_on_export_sun
  alias: "EV charge on export"
  mode: restart

  trigger:
    # Template trigger: also (re)starts the 1-min timer when the EV is plugged
    # in or enabled while export is already high, not only on a threshold cross.
    - id: start
      platform: template
      value_template: >-
        {{ has_value('sensor.shelly_phase_a_power_smoothed')
           and states('sensor.shelly_phase_a_power_smoothed') | float(0) < -2000
           and is_state('binary_sensor.ev_charger_connectivity', 'on')
           and is_state('input_boolean.ev_charge_enable', 'on')
           and is_state('switch.ev_charger', 'off') }}
      for: "00:01:00"

    - id: stop
      platform: numeric_state
      entity_id: sensor.shelly_phase_a_power_smoothed
      above: 500
      for: "00:05:00"

    # Battery guard: the start threshold (-2000 W) is below the EV's ~2300 W
    # draw, so the battery may bridge the gap while the sun ramps up. If the
    # batteries keep discharging (automation 11's commanded total, which excludes
    # PV pass-through) for 15 min, the session runs on stored energy -> stop it.
    - id: battery_drain
      platform: numeric_state
      entity_id: input_number.solarflow_discharge_last
      above: 1200
      for: "00:15:00"

  action:
    - choose:
        # START
        - conditions:
            - condition: trigger
              id: start
            - condition: state
              entity_id: binary_sensor.ev_charger_connectivity
              state: "on"
            - condition: state
              entity_id: input_boolean.ev_charge_enable
              state: "on"
            - condition: state
              entity_id: switch.ev_charger
              state: "off"
          sequence:
            - service: number.set_value
              target:
                entity_id: number.ev_charger_charging_current
              data:
                value: 10

            - service: input_boolean.turn_on
              target:
                entity_id: input_boolean.ev_session_solar

            - delay: "00:00:05"

            - service: switch.turn_on
              target:
                entity_id: switch.ev_charger

            - service: notify.mobile_app_v5
              data:
                title: "EV: Carregamento SOLAR INICIADO"
                message: >-
                  Exportação: {{ states('sensor.shelly_phase_a_power_smoothed') }} W |
                  Corrente: 10 A |
                  Hora: {{ now().strftime('%H:%M') }}

        # STOP only in high tariff period
        - conditions:
            - condition: trigger
              id: [stop, battery_drain]
            - condition: state
              entity_id: switch.ev_charger
              state: "on"
            - condition: time
              after: "08:00:00"
              before: "22:00:00"
            - condition: state
              entity_id: input_boolean.ev_charge_enable
              state: "on"
          sequence:
            - service: switch.turn_off
              target:
                entity_id: switch.ev_charger

            - service: input_boolean.turn_off
              target:
                entity_id: input_boolean.ev_session_solar

            - service: notify.mobile_app_v5
              data:
                title: "EV: Carregamento SOLAR PARADO"
                message: >-
                  Potência rede: {{ states('sensor.shelly_phase_a_power_smoothed') }} W |
                  Hora: {{ now().strftime('%H:%M') }}