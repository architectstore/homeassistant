# ============================================================================
# GRID-ZERO CONTROLLER: Bidirectional discharge/charge (07:00–23:00)
# ============================================================================
#
# Window: 07:00–23:00 — active grid-zero control with per-battery SoC gates
#   - Can charge on solar export from sunrise onwards
#   - Can discharge on import while each battery is above its configured floor
#   - Automation 12 owns 23:00–07:00 always, and 22:00–23:00 / 07:00–08:00 when
#     binary_sensor.solarflow_low_pv_day is ON (cheap tariff, batteries are
#     being kept/charged for the expensive day) -> this automation does nothing
#     in those hours then.
#
# Discharge floor: solarflow_soc_discharge_min, independently per battery.
#
# Evening hold (22:00–23:00): a battery is not discharged when its SoC is
# under 40% AND tomorrow's PV forecast is under 12 kWh, so it isn't drained
# right before a weak-PV day.
#
# EV priority: while the EV is connected, enabled, and not yet charging,
# reserve up to ev_reserve_w of raw solar surplus for it (see automation 21's
# -2000W start threshold; the reserve is 2300W for margin) so the battery
# doesn't claim export the EV could
# use to start a solar-charge session. Once the EV is actually charging,
# the reservation drops and the battery is free to use any leftover surplus.
#
# ============================================================================

# ----------------------------------------------------------------------------
# MAIN GRID-ZERO CONTROLLER
# ----------------------------------------------------------------------------
- id: solarflow_day_grid_zero_step_100w
  alias: "SolarFlow – Grid-Zero Controller (signed, damped, raw Shelly)"
  description: >
    Keeps Shelly Phase A near 0W with ONE signed battery-power value
    (+ = discharge, - = AC charge from solar export). Each run moves the
    previous command by gain * error (damped integrator) using the RAW Shelly
    reading, and only after the previous command has had time to take effect
    (settle gate). Direction changes always pass through 0 for one cycle, and
    export seen while discharging only reduces the discharge - it never starts
    a charge. Per-battery SoC floors are applied independently; a floored
    battery's share is picked up by the other one.
  # single + silent: never interrupt between the mode/limit/helper writes
  mode: single
  max_exceeded: silent
  trace:
    stored_traces: 200

  trigger:
    # Raw (unfiltered) grid reading - every change, no "for:" delay.
    # The settle gate + deadband in the variables below decide whether to act.
    - platform: state
      entity_id: sensor.shelly_phase_a_power
      id: grid_update

    # Heartbeat: retries a pending correction when the grid value is stationary
    - platform: time_pattern
      seconds: "/10"
      id: heartbeat

    - platform: time
      at: "07:00:00"
      id: early_start_0700
    - platform: time
      at: "08:00:00"
      id: day_start
    - platform: time
      at: "22:00:00"
      id: lock_check_2200
    - platform: homeassistant
      event: start
      id: ha_startup

  condition:
    # Manual emergency charge (automation 13) owns the inverters while on
    - condition: state
      entity_id: input_boolean.solarflow_emergency_charge
      state: "off"
    - condition: time
      after: "07:00:00"
      before: "23:00:00"
    # Low-tariff hours (22-08) on a low-PV day belong to automation 12
    - condition: template
      value_template: >
        {% set t = now().strftime('%H:%M') %}
        {{ not (is_state('binary_sensor.solarflow_low_pv_day', 'on')
                and (t >= '22:00' or t < '08:00')) }}
    - condition: template
      value_template: >
        {{ has_value('sensor.shelly_phase_a_power')
           and ((has_value('sensor.solarflow_800_pro_electric_level')
                 and has_value('number.solarflow_800_pro_output_limit')
                 and has_value('number.solarflow_800_pro_input_limit'))
                or
                (has_value('sensor.solarflow_800_pro_2_electric_level')
                 and has_value('number.solarflow_800_pro_2_output_limit')
                 and has_value('number.solarflow_800_pro_2_input_limit'))) }}

  action:
    - variables:
        # ---------------- tuning (totals across both devices) ----------------
        target_import: 20     # W we aim to import (slight import, never export)
        deadband: 40          # W of |error| ignored (grid in -20..+60 W = no action)
        gain: 0.8             # <1 keeps the loop stable despite sensor+inverter lag
        max_step: 800         # W max command change per cycle
        settle_s: 6           # s the last command gets to take effect before re-acting
        min_power: 50         # W below this a command is pointless -> 0
        min_delta: 30         # W minimum change worth writing
        max_discharge: 1600
        max_charge: 2000
        per_device_max: 800
        per_device_max_charge: 1000
        ev_reserve_w: 2300    # 300 W under automation 21's -2000 W start threshold, so export clears it

        # ---------------- measurements ----------------
        grid: "{{ states('sensor.shelly_phase_a_power') | float(0) }}"
        # A device counts as available only with its SoC AND both limits readable.
        # An offline device is never assumed to be at 50 %: it is simply skipped
        # (no discharge, no charge) and the other device takes the full share.
        avail_1: >-
          {{ has_value('sensor.solarflow_800_pro_electric_level')
             and has_value('number.solarflow_800_pro_output_limit')
             and has_value('number.solarflow_800_pro_input_limit') }}
        avail_2: >-
          {{ has_value('sensor.solarflow_800_pro_2_electric_level')
             and has_value('number.solarflow_800_pro_2_output_limit')
             and has_value('number.solarflow_800_pro_2_input_limit') }}
        soc_1: "{{ states('sensor.solarflow_800_pro_electric_level') | float(0) }}"
        soc_2: "{{ states('sensor.solarflow_800_pro_2_electric_level') | float(0) }}"
        last_dis: "{{ states('input_number.solarflow_discharge_last') | float(0) | int }}"
        last_ch: "{{ states('input_number.solarflow_charge_last') | float(0) | int }}"
        # signed command: + discharge, - charge
        p_last: "{{ last_dis - last_ch }}"
        out1_now: "{{ states('number.solarflow_800_pro_output_limit') | float(0) | int }}"
        out2_now: "{{ states('number.solarflow_800_pro_2_output_limit') | float(0) | int }}"
        in1_now: "{{ states('number.solarflow_800_pro_input_limit') | float(0) | int }}"
        in2_now: "{{ states('number.solarflow_800_pro_2_input_limit') | float(0) | int }}"

        # ---------------- policy ----------------
        soc_discharge_min: "{{ states('input_number.solarflow_soc_discharge_min') | float(25) | int }}"
        soc_charge_max: "{{ states('input_number.solarflow_soc_charge_max') | float(90) | int }}"
        # Evening hold: from 22:00, a battery is not discharged when BOTH of:
        #   - its SoC is under evening_hold_soc
        #   - tomorrow's PV forecast is under evening_hold_pv_kwh
        # i.e. don't drain a battery that's already low right before a weak-PV
        # day. Treated like the floor below.
        evening_hold_pv_kwh: 12
        evening_hold_soc: 40
        pv_forecast_tomorrow: "{{ states('sensor.solar_production_estimate_tomorrow_total') | float(999) }}"
        evening_hold: "{{ now().strftime('%H:%M') >= '22:00' and pv_forecast_tomorrow < evening_hold_pv_kwh }}"
        floor_1: "{{ (not avail_1) or (soc_1 <= soc_discharge_min) or (evening_hold and soc_1 < evening_hold_soc) }}"
        floor_2: "{{ (not avail_2) or (soc_2 <= soc_discharge_min) or (evening_hold and soc_2 < evening_hold_soc) }}"
        n_avail: "{{ (0 if floor_1 else 1) + (0 if floor_2 else 1) }}"
        dis_limit: "{{ [max_discharge, per_device_max * n_avail] | min }}"
        # Per-battery charge ceiling (mirrors the discharge floors): a battery at
        # or above soc_charge_max stops charging while the other one continues.
        full_1: "{{ (not avail_1) or soc_1 >= soc_charge_max }}"
        full_2: "{{ (not avail_2) or soc_2 >= soc_charge_max }}"
        ch_n: "{{ (0 if full_1 else 1) + (0 if full_2 else 1) }}"

        # Charge only with the sun up (~30 min after sunrise / before sunset)
        sun_ok: "{{ state_attr('sun.sun', 'elevation') | float(0) > 3 }}"
        # EV priority: leave ev_reserve_w of raw surplus visible as export
        # until the EV has started (automation 21 starts at -2000 W).
        ev_ready_to_start: >-
          {{ is_state('binary_sensor.ev_charger_connectivity', 'on')
             and is_state('input_boolean.ev_charge_enable', 'on')
             and is_state('switch.ev_charger', 'off') }}
        raw_surplus: "{{ last_ch - grid }}"
        charge_cap: >-
          {{ (raw_surplus - ev_reserve_w) | int
             if (ev_ready_to_start and raw_surplus > ev_reserve_w) else max_charge }}
        ch_limit: "{{ ([charge_cap, max_charge, per_device_max_charge * ch_n] | min) if (sun_ok and ch_n > 0) else 0 }}"

        # ---------------- control law ----------------
        error: "{{ grid - target_import }}"
        in_deadband: "{{ error | abs < deadband }}"
        p_raw: >-
          {% if in_deadband %}{{ p_last }}
          {% else %}{{ p_last + ([[gain * error, -max_step] | max, max_step] | min) }}
          {% endif %}
        p_clamped: "{{ [[p_raw, -ch_limit] | max, dis_limit] | min }}"
        p_target: >-
          {% set p = ((p_clamped / 10) | round(0) | int) * 10 %}
          {% if (p_last > 0 and p < 0) or (p_last < 0 and p > 0) %}0
          {% elif not in_deadband and p != p_last and p | abs < min_power %}0
          {% else %}{{ p }}
          {% endif %}

        # ---------------- per-device split ----------------
        dis_total: "{{ [p_target, 0] | max }}"
        ch_total: "{{ [-p_target, 0] | max }}"
        d1: "{{ 0 if (floor_1 or n_avail == 0) else ((dis_total / n_avail) | round(0) | int) }}"
        d2: "{{ 0 if (floor_2 or n_avail == 0) else ((dis_total / n_avail) | round(0) | int) }}"
        c1: "{{ 0 if (full_1 or ch_n == 0) else ((ch_total / ch_n) | round(0) | int) }}"
        c2: "{{ 0 if (full_2 or ch_n == 0) else ((ch_total / ch_n) | round(0) | int) }}"
        want_mode: "{{ 'input' if p_target < 0 else 'output' }}"

        # ---------------- decide whether to act ----------------
        # NB: compute in ONE template - a variable holding a datetime would be
        # re-stored as a string and break the subtraction.
        cmd_age_s: >-
          {{ as_timestamp(now())
             - ([as_timestamp(states.input_number.solarflow_discharge_last.last_changed),
                 as_timestamp(states.input_number.solarflow_charge_last.last_changed)] | max) }}
        settled: "{{ cmd_age_s | float(999) >= settle_s }}"
        floor_cutoff_pending: "{{ (floor_1 and out1_now > 0) or (floor_2 and out2_now > 0) }}"
        changed: >-
          {{ p_target != p_last
             and ((p_target - p_last) | abs >= min_delta or p_target == 0 or p_last == 0) }}
        # device limits drifted from what we commanded (also repairs leftovers)
        mismatch: >-
          {{ (has_value('number.solarflow_800_pro_output_limit') and (out1_now - d1) | abs > 30)
             or (has_value('number.solarflow_800_pro_2_output_limit') and (out2_now - d2) | abs > 30)
             or (has_value('number.solarflow_800_pro_input_limit') and (in1_now - c1) | abs > 30)
             or (has_value('number.solarflow_800_pro_2_input_limit') and (in2_now - c2) | abs > 30) }}
        act: "{{ (settled or floor_cutoff_pending) and (changed or mismatch) }}"

    - condition: template
      value_template: "{{ act }}"

    # AC mode only when the direction actually needs it (never while idle)
    - if:
        - condition: template
          value_template: >-
            {{ p_target != 0 and
               (states('select.solarflow_800_pro_ac_mode') != want_mode
                or states('select.solarflow_800_pro_2_ac_mode') != want_mode) }}
      then:
        - service: select.select_option
          target:
            entity_id:
              - select.solarflow_800_pro_ac_mode
              - select.solarflow_800_pro_2_ac_mode
          data:
            option: "{{ want_mode }}"
          continue_on_error: true

    - service: number.set_value
      target:
        entity_id: number.solarflow_800_pro_output_limit
      data:
        value: "{{ d1 }}"
      continue_on_error: true
    - service: number.set_value
      target:
        entity_id: number.solarflow_800_pro_2_output_limit
      data:
        value: "{{ d2 }}"
      continue_on_error: true
    - service: number.set_value
      target:
        entity_id: number.solarflow_800_pro_input_limit
      data:
        value: "{{ c1 }}"
      continue_on_error: true
    - service: number.set_value
      target:
        entity_id: number.solarflow_800_pro_2_input_limit
      data:
        value: "{{ c2 }}"
      continue_on_error: true

    - service: input_number.set_value
      target:
        entity_id: input_number.solarflow_discharge_last
      data:
        value: "{{ dis_total }}"
    - service: input_number.set_value
      target:
        entity_id: input_number.solarflow_charge_last
      data:
        value: "{{ ch_total }}"

    - service: system_log.write
      data:
        level: info
        logger: solarflow_grid_control
        message: >
          GRIDZERO grid={{ grid }}W err={{ error | round(0) }} p {{ p_last }}->{{ p_target }}W
          (dis b1={{ d1 }} b2={{ d2 }}, ch b1={{ c1 }} b2={{ c2 }}) soc={{ soc_1 }}/{{ soc_2 }}%
          ch_limit={{ ch_limit }} settled={{ settled }} mismatch={{ mismatch }} trigger={{ trigger.id }}
