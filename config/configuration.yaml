
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include_dir_merge_list automations
sensor: !include_dir_merge_list sensors
template: !include_dir_merge_list templates

script: !include scripts.yaml
scene: !include scenes.yaml

mqtt:
  sensor:
    - name: "Shelly Phase A Power"
      unique_id: shelly_phase_a_power
      state_topic: "shellypro3em-ece334eb846c/status/em:0"
      value_template: "{{ value_json.a_act_power | float(0) }}"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      # Shelly publishes several times per second; if it goes silent the
      # sensor (and the smoothed one derived from it) turns unavailable
      # instead of freezing on the last value.
      expire_after: 60

input_number: !include helpers/input_number.yaml
input_boolean: !include helpers/input_boolean.yaml
input_text: !include helpers/input_text.yaml

# Daily PV generation: resets at local midnight, source is sensors/13_pv_energy.yaml
utility_meter:
  pv_energy_daily:
    source: sensor.pv_energy_total
    cycle: daily

http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 192.168.50.210
    - 192.168.50.136
    - 192.168.50.72
