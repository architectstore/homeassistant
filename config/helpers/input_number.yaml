solarflow_discharge_last:
  name: SolarFlow last discharge limit (total both devices)
  min: 0
  max: 1600
  step: 10
  unit_of_measurement: W
  mode: box
  icon: mdi:battery-arrow-down

solarflow_charge_last:
  name: ALL SolarFlow last AC charge limit (total both devices)
  min: 0
  max: 2000
  step: 10
  unit_of_measurement: W
  mode: box
  icon: mdi:battery-arrow-up

solarflow_soc_discharge_min:
  name: "11 SolarFlow min SoC for discharge"
  min: 0
  max: 50
  step: 1
  unit_of_measurement: "%"
  mode: slider
  icon: mdi:battery-arrow-down

solarflow_soc_charge_max:
  name: "11 SolarFlow max SoC for charge"
  min: 50
  max: 100
  step: 1
  unit_of_measurement: "%"
  mode: slider
  icon: mdi:battery-arrow-up

solarflow_daily_consumption_kwh:
  name: "12 Daily consumption in high-tariff hours"
  min: 0
  max: 20
  step: 0.5
  unit_of_measurement: "kWh"
  mode: slider
  icon: mdi:home-lightning-bolt
