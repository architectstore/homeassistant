# ============================================================================
# GRID-ZERO CONTROLLER: Bidirectional discharge/charge (07:00–22:00)
# ============================================================================
#
# Window: 07:00–22:00 (high tariff period)
#   - 07:00–08:00: gate with SoC >= 75% (early morning, wait for PV)
#   - 08:00–22:00: full grid-zero control (discharge on import, charge on solar export)
#
# Discharge floor: dynamic based on tariff
#   - 08:00–22:00 (high tariff): allow discharge down to 5% SoC to minimize grid import
#   - 22:00–08:00 (low tariff): protect at 25% SoC (unless auto 12 is charging)
#
# Night (22:00–08:00): auto 11 idles if:
#   - Auto 12 is actively charging (last_charge > 0), OR
#   - PV forecast < 10 kWh AND SoC <= 45% (preserve battery for low-PV day)
#
# ============================================================================

# ----------------------------------------------------------------------------
# MAIN GRID-ZERO CONTROLLER
# ----------------------------------------------------------------------------
- id: solarflow_day_grid_zero_step_100w
  alias: "SolarFlow – Grid-Zero 100W Steps (08:00–22:00; discharge to 5% on high tariff)"
  description: >
    Keep Shelly Phase A around 0W using 100W step control.
    Discharges to cover house load (avoid grid import). Charges from solar export (sunrise–sunset).
    During high tariff (08:00–22:00), allows discharge down to 5% SoC to minimize grid consumption.
    Idles at night if auto 12 is charging or if low PV forecast + low SoC.
  mode: restart
  trace:
    stored_traces: 720  # ~12h if it triggers every minute

  trigger:
    # Import side (want discharge)
    - platform: numeric_state
      entity_id: sensor.shelly_phase_a_power_smoothed
      above: 75
      for: "00:00:05"
      id: import_high

    # Export side (want charge)
    - platform: numeric_state
      entity_id: sensor.shelly_phase_a_power_smoothed
      below: -100
      for: "00:00:10"
      id: export_high

    # Periodic reevaluation
    - platform: time_pattern
      minutes: "/1"
      id: periodic

    # Early start evaluation
    - platform: time
      at: "07:00:00"
      id: early_start_0700

    # Normal day start
    - platform: time
      at: "08:00:00"
      id: day_start

    # Enforce lock check exactly at 22:00
    - platform: time
      at: "22:00:00"
      id: lock_check_2200

    # After HA restart
    - platform: homeassistant
      event: start
      id: ha_startup

  condition:
    # Active window: 07:00–22:00 (high tariff hours)
    - condition: time
      after: "07:00:00"
      before: "22:00:00"

    # Early hour gate (07:00–08:00): require SoC >= 75% to start early
    # After 08:00: no SoC gate, run normally
    - condition: template
      value_template: >
        {% set t = now().strftime('%H:%M:%S') %}
        {% set soc_val = ((states('sensor.solarflow_800_pro_electric_level') | float(50)) +
                          (states('sensor.solarflow_800_pro_2_electric_level') | float(50))) / 2 %}
        {{ (t >= '08:00:00') or (soc_val >= 75) }}

    # Entities available
    - condition: template
      value_template: >
        {{ states('sensor.solarflow_800_pro_electric_level') not in ['unknown','unavailable'] }}

    - condition: template
      value_template: >
        {{ states('sensor.shelly_phase_a_power_smoothed') not in ['unknown','unavailable'] }}

    - condition: template
      value_template: >
        {{ states('number.solarflow_800_pro_output_limit') not in ['unknown','unavailable']
           and states('number.solarflow_800_pro_input_limit') not in ['unknown','unavailable'] }}

  action:
    - variables:
        grid: "{{ states('sensor.shelly_phase_a_power_smoothed') | float(0) }}"
        soc: >-
          {{ ((states('sensor.solarflow_800_pro_electric_level') | float(50)) +
              (states('sensor.solarflow_800_pro_2_electric_level') | float(50))) / 2 }}
        last_discharge: "{{ states('input_number.solarflow_discharge_last') | float(0) | int }}"
        last_charge: "{{ states('input_number.solarflow_charge_last') | float(0) | int }}"
        soc_discharge_min: "{{ states('input_number.solarflow_soc_discharge_min') | float(25) | int }}"
        soc_charge_max: "{{ states('input_number.solarflow_soc_charge_max') | float(90) | int }}"

        # --- policy knobs ---
        evening_soc_min: "{{ states('input_number.solarflow_evening_soc_min') | float(45) | int }}"

        # Night window check
        night_charge_window: >-
          {% set t = now().strftime('%H:%M:%S') %}
          {{ (t >= '22:00:00') or (t < '08:00:00') }}

        # Check tomorrow's PV forecast (at night, 'today' sensor shows next day's forecast)
        # Only evaluated at 22:00+ for accuracy
        pv_forecast_tomorrow: "{{ states('sensor.solar_production_estimate_today_total') | float(0) }}"
        low_pv_tomorrow: "{{ pv_forecast_tomorrow < 10 }}"

        # Idle if:
        # 1. Auto 12 is actively charging (last_charge > 0) – avoid AC port conflict
        # 2. OR night window AND low PV forecast AND SoC at floor – preserve battery for low-PV day
        should_idle: >-
          {{ (last_charge > 0) or (night_charge_window and low_pv_tomorrow and soc <= evening_soc_min) }}



        # --- tuning (total across both devices; each device gets value / 2) ---
        step_size: 100
        max_discharge: 1600
        max_charge: 2000
        min_delta: 40

        # -------------------------
        # IMPORT → DISCHARGE target
        # -------------------------
        # After 08:00 (high tariff): allow discharge below soc_discharge_min to minimize grid import
        # Before 08:00 (low tariff): protect floor SoC
        discharge_min_threshold: >-
          {% set t = now().strftime('%H:%M:%S') %}
          {% if t >= '08:00:00' and t < '22:00:00' %}
            5
          {% else %}
            {{ soc_discharge_min }}
          {% endif %}
        target_discharge: >-
          {% set ld = last_discharge | int %}
          {% set g = grid | float %}
          {% set soc_min = discharge_min_threshold | int %}
          {% set step = step_size | int %}
          {% set maxd = max_discharge | int %}
          {% if soc <= soc_min %}
            0
          {% else %}
            {% set load_est = g + ld %}
            {% set ideal = load_est - 50 %}
            {% if ideal < 0 %}{% set ideal = 0 %}{% endif %}
            {% if ideal > maxd %}{% set ideal = maxd %}{% endif %}
            {% if g > 800 %}
              {{ ideal }}
            {% elif g > 400 %}
              {% set max_jump = step * 3 %}
              {% if ideal > ld + max_jump %}
                {{ ld + max_jump }}
              {% elif ideal < ld - max_jump %}
                {{ ld - max_jump }}
              {% else %}
                {{ ideal }}
              {% endif %}
            {% else %}
              {% if ideal > ld + step %}
                {{ ld + step }}
              {% elif ideal < ld - step %}
                {{ ld - step }}
              {% else %}
                {{ ideal }}
              {% endif %}
            {% endif %}
          {% endif %}

        # -------------------------
        # EXPORT → CHARGE steps
        # -------------------------
        export_step: >-
          {% if soc >= soc_charge_max %}
            0
          {% elif grid < -950 %}
            20
          {% elif grid < -850 %}
            18
          {% elif grid < -750 %}
            16
          {% elif grid < -650 %}
            14
          {% elif grid < -550 %}
            12
          {% elif grid < -450 %}
            10
          {% elif grid < -350 %}
            8
          {% elif grid < -250 %}
            6
          {% elif grid < -150 %}
            4
          {% elif grid < -100 %}
            2
          {% else %}
            0
          {% endif %}

        export_power: >-
          {% set p = (export_step | int) * step_size %}
          {% if p > max_charge %}
            {{ max_charge }}
          {% else %}
            {{ p }}
          {% endif %}

        target_charge: >-
          {% set lc = last_charge | int %}
          {% set rbp = export_power | int %}
          {% set g = grid | float %}
          {% if rbp > lc %}
            {{ rbp }}
          {% elif g < -250 %}
            {{ lc + (step_size * 2) }}
          {% elif g < -150 %}
            {{ lc + step_size }}
          {% elif rbp < lc and g < -80 %}
            {{ lc }}
          {% elif rbp < lc %}
            {{ rbp }}
          {% else %}
            {{ lc }}
          {% endif %}

        final_discharge: >-
          {% set g = grid | float %}
          {% set td = target_discharge | int %}
          {% set ld = last_discharge | int %}
          {% if g > 120 %}
            {{ td }}
          {% elif g < -100 %}
            0
          {% else %}
            {{ ld }}
          {% endif %}

        final_charge: >-
          {% set g = grid | float %}
          {% set lc = last_charge | int %}
          {% set tc = target_charge | int %}
          {% set sun_state = states('sun.sun') %}
          {% set can_daycharge = (sun_state == 'above_horizon') %}
          {% set max_ch = max_charge | int %}
          {% set step = step_size | int %}
          {% if g <= -80 and can_daycharge %}
            {% set fc = tc %}
          {% elif -80 < g < 80 %}
            {% set fc = lc %}
          {% elif 80 <= g <= 250 %}
            {% set reduce = (g | int) %}
            {% set raw = lc - reduce %}
            {% if raw < 0 %}
              {% set fc = 0 %}
            {% else %}
              {% set steps = (raw // step) | int %}
              {% set fc = (steps * step) | int %}
            {% endif %}
          {% else %}
            {% set fc = 0 %}
          {% endif %}
          {% if fc < 0 %}
            0
          {% elif fc > max_ch %}
            {{ max_ch }}
          {% else %}
            {{ fc }}
          {% endif %}

        delta_dis: "{{ ((final_discharge | int) - (last_discharge | int)) | abs }}"
        delta_ch: "{{ ((final_charge | int) - (last_charge | int)) | abs }}"

    - choose:
        # ============================================================
        # RULE: Idle when auto 12 charges (22:00–08:00 planned)
        #       or when SoC low after 22:00 (planned OFF)
        # ============================================================
        - conditions:
            - condition: template
              value_template: "{{ should_idle }}"
          sequence:
            - if:
                - condition: template
                  value_template: >
                    {{ (last_discharge | int) != 0 or (last_charge | int) != 0 }}
              then:
                - service: number.set_value
                  target:
                    entity_id:
                      - number.solarflow_800_pro_output_limit
                      - number.solarflow_800_pro_input_limit
                      - number.solarflow_800_pro_2_output_limit
                      - number.solarflow_800_pro_2_input_limit
                  data:
                    value: 0
                  continue_on_error: true

                - service: input_number.set_value
                  target:
                    entity_id:
                      - input_number.solarflow_discharge_last
                      - input_number.solarflow_charge_last
                  data:
                    value: 0

                - service: system_log.write
                  data:
                    level: debug
                    logger: solarflow_grid_control
                    message: >
                      {% if last_charge > 0 %}
                      "STEP100 IDLE: Auto 12 charging ({{ last_charge }}W), grid={{ grid }}W, trigger={{ trigger.id }}"
                      {% else %}
                      "STEP100 NIGHT-IDLE: SoC={{ soc }}% <= evening_min={{ evening_soc_min }}%, pv_forecast={{ pv_forecast_tomorrow }}kWh (low=<10), grid={{ grid }}W, trigger={{ trigger.id }}"
                      {% endif %}

            - stop: "Idle (Auto 12 charging or low SoC + low PV forecast)"

        # BRANCH A: DISCHARGE
        - conditions:
            - condition: template
              value_template: "{{ final_discharge | int > 0 }}"
            - condition: template
              value_template: "{{ delta_dis | int >= min_delta or (last_discharge | int) == 0 }}"
          sequence:
            - service: select.select_option
              target:
                entity_id:
                  - select.solarflow_800_pro_ac_mode
                  - select.solarflow_800_pro_2_ac_mode
              data:
                option: "output"
              continue_on_error: true

            - service: number.set_value
              target:
                entity_id:
                  - number.solarflow_800_pro_output_limit
                  - number.solarflow_800_pro_2_output_limit
              data:
                value: "{{ (final_discharge / 2) | round(0) | int }}"
              continue_on_error: true

            - service: number.set_value
              target:
                entity_id:
                  - number.solarflow_800_pro_input_limit
                  - number.solarflow_800_pro_2_input_limit
              data:
                value: 0
              continue_on_error: true

            - service: input_number.set_value
              target:
                entity_id: input_number.solarflow_discharge_last
              data:
                value: "{{ final_discharge | int }}"

            - service: input_number.set_value
              target:
                entity_id: input_number.solarflow_charge_last
              data:
                value: 0

            - service: system_log.write
              data:
                level: info
                logger: solarflow_grid_control
                message: >
                  "STEP100 DISCH: grid={{ grid }}W, soc={{ soc }}%, new={{ final_discharge }}W ({{ (final_discharge/2)|int }}W/device),
                  last={{ last_discharge }}W, delta={{ delta_dis }}W, trigger={{ trigger.id }}"

        # BRANCH B: CHARGE
        - conditions:
            - condition: template
              value_template: "{{ final_charge | int > 0 }}"
            - condition: template
              value_template: "{{ delta_ch | int >= min_delta or (last_charge | int) == 0 }}"
            - condition: sun
              after: sunrise
              after_offset: "00:30:00"
            - condition: sun
              before: sunset
              before_offset: "-00:30:00"
          sequence:
            - service: select.select_option
              target:
                entity_id:
                  - select.solarflow_800_pro_ac_mode
                  - select.solarflow_800_pro_2_ac_mode
              data:
                option: "input"
              continue_on_error: true

            - service: number.set_value
              target:
                entity_id:
                  - number.solarflow_800_pro_input_limit
                  - number.solarflow_800_pro_2_input_limit
              data:
                value: "{{ (final_charge / 2) | round(0) | int }}"
              continue_on_error: true

            - service: number.set_value
              target:
                entity_id:
                  - number.solarflow_800_pro_output_limit
                  - number.solarflow_800_pro_2_output_limit
              data:
                value: 0
              continue_on_error: true

            - service: input_number.set_value
              target:
                entity_id: input_number.solarflow_charge_last
              data:
                value: "{{ final_charge | int }}"

            - service: input_number.set_value
              target:
                entity_id: input_number.solarflow_discharge_last
              data:
                value: 0

            - service: system_log.write
              data:
                level: info
                logger: solarflow_grid_control
                message: >
                  "STEP100 CHARGE: grid={{ grid }}W, soc={{ soc }}%, new={{ final_charge }}W ({{ (final_charge/2)|int }}W/device),
                  last={{ last_charge }}W, delta={{ delta_ch }}W, trigger={{ trigger.id }}"

      default:
        # DEFAULT: IDLE (both 0) – only when both targets are zero
        - condition: template
          value_template: >
            {{ (final_discharge | int) == 0
               and (final_charge | int) == 0
               and ((last_discharge | int) != 0 or (last_charge | int) != 0) }}

        - service: number.set_value
          target:
            entity_id:
              - number.solarflow_800_pro_output_limit
              - number.solarflow_800_pro_input_limit
              - number.solarflow_800_pro_2_output_limit
              - number.solarflow_800_pro_2_input_limit
          data:
            value: 0
          continue_on_error: true

        - service: input_number.set_value
          target:
            entity_id:
              - input_number.solarflow_discharge_last
              - input_number.solarflow_charge_last
          data:
            value: 0

        - service: system_log.write
          data:
            level: info
            logger: solarflow_grid_control
            message: >
              "STEP100 IDLE: grid={{ grid }}W, soc={{ soc }}%, trigger={{ trigger.id }}"

