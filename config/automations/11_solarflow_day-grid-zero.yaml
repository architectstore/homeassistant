# ============================================================================
# GRID-ZERO CONTROLLER: Bidirectional discharge/charge (07:00–23:00)
# ============================================================================
#
# Window: 07:00–23:00 — active grid-zero control with per-battery SoC gates
#   - Can charge on solar export anytime (even if SoC low) from sunrise onwards
#   - Can discharge on import while each battery is above its configured floor
#   - Automation 12 takes over at 23:00: idle 23:00–00:30, then charge/idle
#     00:30–07:00 according to forecast and grid headroom.
#
# Discharge floors:
#   - All day: protect solarflow_soc_discharge_min independently per battery
#   - 22:00–23:00 with forecast < 10 kWh: protect solarflow_evening_soc_min
#     independently per battery
#
# Night (22:00–08:00):
#   - Idle both batteries if auto 12 is charging.
#   - On a low-PV forecast, stop each battery independently when it reaches 45%.
#
# EV priority: while the EV is connected, enabled, and not yet charging,
# reserve up to ev_reserve_w of raw solar surplus for it (see automation 21's
# -2500W start threshold) so the battery doesn't claim export the EV could
# use to start a solar-charge session. Once the EV is actually charging,
# the reservation drops and the battery is free to use any leftover surplus.
#
# ============================================================================

# ----------------------------------------------------------------------------
# MAIN GRID-ZERO CONTROLLER
# ----------------------------------------------------------------------------
- id: solarflow_day_grid_zero_step_100w
  alias: "SolarFlow – Grid-Zero 100W Steps (configurable minimum SoC floor)"
  description: >
    Keep Shelly Phase A around 0W using 100W step control.
    Discharges to cover house load (avoid grid import). Charges from solar export (sunrise–sunset).
    Maintains the configured minimum SoC floor while discharging to minimize grid consumption.
    Idles both batteries if auto 12 is charging. During low-PV nights, enforces
    the evening SoC floor independently for each battery.
  mode: restart
  trace:
    stored_traces: 720  # ~12h if it triggers every minute

  trigger:
    # Import side (want discharge)
    - platform: numeric_state
      entity_id: sensor.shelly_phase_a_power_smoothed
      above: 75
      for: "00:00:05"
      id: import_high

    # Export side (want charge)
    - platform: numeric_state
      entity_id: sensor.shelly_phase_a_power_smoothed
      below: -100
      for: "00:00:10"
      id: export_high

    # Periodic reevaluation
    - platform: time_pattern
      minutes: "/1"
      id: periodic

    # Early start evaluation
    - platform: time
      at: "07:00:00"
      id: early_start_0700

    # Normal day start
    - platform: time
      at: "08:00:00"
      id: day_start

    # Enforce lock check exactly at 22:00
    - platform: time
      at: "22:00:00"
      id: lock_check_2200

    # After HA restart
    - platform: homeassistant
      event: start
      id: ha_startup

  condition:
    # Active window: 07:00–23:00
    - condition: time
      after: "07:00:00"
      before: "23:00:00"

    # Entities available
    - condition: template
      value_template: >
        {{ states('sensor.solarflow_800_pro_electric_level') not in ['unknown','unavailable'] }}

    - condition: template
      value_template: >
        {{ states('sensor.shelly_phase_a_power_smoothed') not in ['unknown','unavailable'] }}

    - condition: template
      value_template: >
        {{ states('number.solarflow_800_pro_output_limit') not in ['unknown','unavailable']
           and states('number.solarflow_800_pro_input_limit') not in ['unknown','unavailable'] }}

  action:
    - variables:
        grid: "{{ states('sensor.shelly_phase_a_power_smoothed') | float(0) }}"
        soc_1: "{{ states('sensor.solarflow_800_pro_electric_level') | float(50) }}"
        soc_2: "{{ states('sensor.solarflow_800_pro_2_electric_level') | float(50) }}"
        soc: >-
          {{ ((states('sensor.solarflow_800_pro_electric_level') | float(50)) +
              (states('sensor.solarflow_800_pro_2_electric_level') | float(50))) / 2 }}
        last_discharge: "{{ states('input_number.solarflow_discharge_last') | float(0) | int }}"
        last_charge: "{{ states('input_number.solarflow_charge_last') | float(0) | int }}"

        # --- EV export priority ---
        # Reserve export headroom for the EV (automation 21 starts solar-charging
        # at -2500W sustained) while it's connected/enabled and not yet charging.
        # Once it's actually charging, drop the reservation and let the battery
        # use whatever surplus is left.
        ev_reserve_w: 2500
        ev_ready_to_start: >-
          {{ is_state('binary_sensor.ev_charger_connectivity', 'on')
             and is_state('input_boolean.ev_charge_enable', 'on')
             and is_state('switch.ev_charger', 'off') }}
        # Raw pre-battery solar surplus: grid reading already reflects the
        # battery's own last charge action, so add it back to see the true surplus.
        raw_surplus: "{{ (last_charge - grid) | round(0) | int }}"

        soc_discharge_min: "{{ states('input_number.solarflow_soc_discharge_min') | float(25) | int }}"
        soc_charge_max: "{{ states('input_number.solarflow_soc_charge_max') | float(90) | int }}"

        # --- policy knobs ---
        evening_soc_min: "{{ states('input_number.solarflow_evening_soc_min') | float(45) | int }}"

        # Night window check
        night_charge_window: >-
          {% set t = now().strftime('%H:%M:%S') %}
          {{ (t >= '22:00:00') or (t < '08:00:00') }}

        # Preserve each battery for the coming day using its explicit tomorrow forecast.
        pv_forecast_tomorrow: "{{ states('sensor.solar_production_estimate_tomorrow_total') | float(0) }}"
        pv_forecast_available: >-
          {{ states('sensor.solar_production_estimate_tomorrow_total')
             not in ['unknown','unavailable','none',''] }}
        low_pv_tomorrow: "{{ pv_forecast_available and pv_forecast_tomorrow < 10 }}"

        # Auto 12 charging requires both batteries to idle. Low-PV protection is
        # handled per battery below, so one battery can stop while the other runs.
        should_idle: "{{ last_charge > 0 }}"
        low_pv_night_protection: "{{ night_charge_window and low_pv_tomorrow }}"
        battery_1_floor_reached: >-
          {{ soc_1 <= soc_discharge_min
             or (low_pv_night_protection and soc_1 <= evening_soc_min) }}
        battery_2_floor_reached: >-
          {{ soc_2 <= soc_discharge_min
             or (low_pv_night_protection and soc_2 <= evening_soc_min) }}

        # --- tuning (total across both devices; each device gets value / 2) ---
        step_size: 100
        max_discharge: 1600
        max_charge: 2000
        min_delta: 40

        # EV reservation cap, now that max_charge is known (see EV export
        # priority note above)
        charge_cap: >-
          {% if ev_ready_to_start and raw_surplus > ev_reserve_w %}
            {{ raw_surplus - ev_reserve_w }}
          {% else %}
            {{ max_charge }}
          {% endif %}

        # -------------------------
        # IMPORT → DISCHARGE target
        # -------------------------
        # Compute the grid-zero discharge target independently of pack SoC.
        # Per-pack floors are applied to each output limit below.
        target_discharge: >-
          {% set ld = last_discharge | int %}
          {% set g = grid | float %}
          {% set step = step_size | int %}
          {% set maxd = max_discharge | int %}
          {% set load_est = g + ld %}
          {% set ideal = load_est - 50 %}
          {% if ideal < 0 %}{% set ideal = 0 %}{% endif %}
          {% if ideal > maxd %}{% set ideal = maxd %}{% endif %}
          {% if g > 800 %}
            {{ ideal }}
          {% elif g > 400 %}
            {% set max_jump = step * 3 %}
            {% if ideal > ld + max_jump %}
              {{ ld + max_jump }}
            {% elif ideal < ld - max_jump %}
              {{ ld - max_jump }}
            {% else %}
              {{ ideal }}
            {% endif %}
          {% else %}
            {% if ideal > ld + step %}
              {{ ld + step }}
            {% elif ideal < ld - step %}
              {{ ld - step }}
            {% else %}
              {{ ideal }}
            {% endif %}
          {% endif %}

        # -------------------------
        # EXPORT → CHARGE steps
        # -------------------------
        export_step: >-
          {% if soc >= soc_charge_max %}
            0
          {% elif grid < -950 %}
            20
          {% elif grid < -850 %}
            18
          {% elif grid < -750 %}
            16
          {% elif grid < -650 %}
            14
          {% elif grid < -550 %}
            12
          {% elif grid < -450 %}
            10
          {% elif grid < -350 %}
            8
          {% elif grid < -250 %}
            6
          {% elif grid < -150 %}
            4
          {% elif grid < -100 %}
            2
          {% else %}
            0
          {% endif %}

        export_power: >-
          {% set p = (export_step | int) * step_size %}
          {% if p > max_charge %}
            {{ max_charge }}
          {% else %}
            {{ p }}
          {% endif %}

        target_charge: >-
          {% set lc = last_charge | int %}
          {% set rbp = export_power | int %}
          {% set g = grid | float %}
          {% if rbp > lc %}
            {{ rbp }}
          {% elif g < -250 %}
            {{ lc + (step_size * 2) }}
          {% elif g < -150 %}
            {{ lc + step_size }}
          {% elif rbp < lc and g < -80 %}
            {{ lc }}
          {% elif rbp < lc %}
            {{ rbp }}
          {% else %}
            {{ lc }}
          {% endif %}

        final_discharge: >-
          {% set g = grid | float %}
          {% set td = target_discharge | int %}
          {% set ld = last_discharge | int %}
          {% if g > 120 %}
            {{ td }}
          {% elif g < -100 %}
            0
          {% else %}
            {{ ld }}
          {% endif %}

        battery_1_output_now: "{{ states('number.solarflow_800_pro_output_limit') | float(0) | int }}"
        battery_2_output_now: "{{ states('number.solarflow_800_pro_2_output_limit') | float(0) | int }}"
        battery_1_discharge_target: >-
          {% if battery_1_floor_reached %}
            0
          {% else %}
            {{ (final_discharge / 2) | round(0) | int }}
          {% endif %}
        battery_2_discharge_target: >-
          {% if battery_2_floor_reached %}
            0
          {% else %}
            {{ (final_discharge / 2) | round(0) | int }}
          {% endif %}
        discharge_cutoff_needs_apply: >-
          {{ (battery_1_floor_reached and battery_1_output_now > 0)
             or (battery_2_floor_reached and battery_2_output_now > 0) }}
        target_discharge_total: >-
          {{ (battery_1_discharge_target | int) + (battery_2_discharge_target | int) }}

        final_charge: >-
          {% set g = grid | float %}
          {% set lc = last_charge | int %}
          {% set tc = target_charge | int %}
          {% set sun_state = states('sun.sun') %}
          {% set can_daycharge = (sun_state == 'above_horizon') %}
          {% set max_ch = charge_cap | int %}
          {% set step = step_size | int %}
          {% if g <= -80 and can_daycharge %}
            {% set fc = tc %}
          {% elif -80 < g < 80 %}
            {% set fc = lc %}
          {% elif 80 <= g <= 250 %}
            {% set reduce = (g | int) %}
            {% set raw = lc - reduce %}
            {% if raw < 0 %}
              {% set fc = 0 %}
            {% else %}
              {% set steps = (raw // step) | int %}
              {% set fc = (steps * step) | int %}
            {% endif %}
          {% else %}
            {% set fc = 0 %}
          {% endif %}
          {% if fc < 0 %}
            0
          {% elif fc > max_ch %}
            {{ max_ch }}
          {% else %}
            {{ fc }}
          {% endif %}

        delta_dis: "{{ ((final_discharge | int) - (last_discharge | int)) | abs }}"
        delta_ch: "{{ ((final_charge | int) - (last_charge | int)) | abs }}"

    - choose:
        # ============================================================
        # RULE: Idle both batteries when auto 12 is charging. Low-PV SoC
        #       protection is applied independently to each battery output.
        # ============================================================
        - conditions:
            - condition: template
              value_template: "{{ should_idle }}"
          sequence:
            - if:
                - condition: template
                  value_template: >
                    {{ (last_discharge | int) != 0 or (last_charge | int) != 0 }}
              then:
                - service: number.set_value
                  target:
                    entity_id:
                      - number.solarflow_800_pro_output_limit
                      - number.solarflow_800_pro_input_limit
                      - number.solarflow_800_pro_2_output_limit
                      - number.solarflow_800_pro_2_input_limit
                  data:
                    value: 0
                  continue_on_error: true

                - service: input_number.set_value
                  target:
                    entity_id:
                      - input_number.solarflow_discharge_last
                      - input_number.solarflow_charge_last
                  data:
                    value: 0

                - service: system_log.write
                  data:
                    level: debug
                    logger: solarflow_grid_control
                    message: >
                      {% if last_charge > 0 %}
                      "STEP100 IDLE: Auto 12 charging ({{ last_charge }}W), grid={{ grid }}W, trigger={{ trigger.id }}"
                      {% endif %}

            - stop: "Idle while auto 12 is charging"

        # BRANCH A: DISCHARGE (each battery has its own SoC cutoff)
        - conditions:
            - condition: template
              value_template: >-
                {{ target_discharge_total | int > 0 or discharge_cutoff_needs_apply }}
            - condition: template
              value_template: >-
                {{ delta_dis | int >= min_delta
                   or (last_discharge | int) == 0
                   or discharge_cutoff_needs_apply }}
          sequence:
            - service: select.select_option
              target:
                entity_id:
                  - select.solarflow_800_pro_ac_mode
                  - select.solarflow_800_pro_2_ac_mode
              data:
                option: "output"
              continue_on_error: true

            - service: number.set_value
              target:
                entity_id: number.solarflow_800_pro_output_limit
              data:
                value: "{{ battery_1_discharge_target | int }}"
              continue_on_error: true

            - service: number.set_value
              target:
                entity_id: number.solarflow_800_pro_2_output_limit
              data:
                value: "{{ battery_2_discharge_target | int }}"
              continue_on_error: true

            - service: number.set_value
              target:
                entity_id:
                  - number.solarflow_800_pro_input_limit
                  - number.solarflow_800_pro_2_input_limit
              data:
                value: 0
              continue_on_error: true

            - service: input_number.set_value
              target:
                entity_id: input_number.solarflow_discharge_last
              data:
                value: "{{ target_discharge_total | int }}"

            - service: input_number.set_value
              target:
                entity_id: input_number.solarflow_charge_last
              data:
                value: 0

            - service: system_log.write
              data:
                level: info
                logger: solarflow_grid_control
                message: >
                  "STEP100 DISCH: grid={{ grid }}W, soc1={{ soc_1 }}%, soc2={{ soc_2 }}%, new={{ target_discharge_total }}W (batt1={{ battery_1_discharge_target }}W, batt2={{ battery_2_discharge_target }}W),
                  last={{ last_discharge }}W, delta={{ delta_dis }}W, trigger={{ trigger.id }}"

        # BRANCH B: CHARGE
        - conditions:
            - condition: template
              value_template: "{{ final_charge | int > 0 }}"
            - condition: template
              value_template: "{{ delta_ch | int >= min_delta or (last_charge | int) == 0 }}"
            - condition: sun
              after: sunrise
              after_offset: "00:30:00"
            - condition: sun
              before: sunset
              before_offset: "-00:30:00"
          sequence:
            - service: select.select_option
              target:
                entity_id:
                  - select.solarflow_800_pro_ac_mode
                  - select.solarflow_800_pro_2_ac_mode
              data:
                option: "input"
              continue_on_error: true

            - service: number.set_value
              target:
                entity_id:
                  - number.solarflow_800_pro_input_limit
                  - number.solarflow_800_pro_2_input_limit
              data:
                value: "{{ (final_charge / 2) | round(0) | int }}"
              continue_on_error: true

            - service: number.set_value
              target:
                entity_id:
                  - number.solarflow_800_pro_output_limit
                  - number.solarflow_800_pro_2_output_limit
              data:
                value: 0
              continue_on_error: true

            - service: input_number.set_value
              target:
                entity_id: input_number.solarflow_charge_last
              data:
                value: "{{ final_charge | int }}"

            - service: input_number.set_value
              target:
                entity_id: input_number.solarflow_discharge_last
              data:
                value: 0

            - service: system_log.write
              data:
                level: info
                logger: solarflow_grid_control
                message: >
                  "STEP100 CHARGE: grid={{ grid }}W, soc={{ soc }}%, new={{ final_charge }}W ({{ (final_charge/2)|int }}W/device),
                  last={{ last_charge }}W, delta={{ delta_ch }}W, charge_cap={{ charge_cap }}W (ev_reserve={{ ev_ready_to_start }}),
                  trigger={{ trigger.id }}"

      default:
        # DEFAULT: IDLE (both 0) – only when both targets are zero
        - condition: template
          value_template: >
            {{ (final_discharge | int) == 0
               and (final_charge | int) == 0
               and ((last_discharge | int) != 0 or (last_charge | int) != 0) }}

        - service: number.set_value
          target:
            entity_id:
              - number.solarflow_800_pro_output_limit
              - number.solarflow_800_pro_input_limit
              - number.solarflow_800_pro_2_output_limit
              - number.solarflow_800_pro_2_input_limit
          data:
            value: 0
          continue_on_error: true

        - service: input_number.set_value
          target:
            entity_id:
              - input_number.solarflow_discharge_last
              - input_number.solarflow_charge_last
          data:
            value: 0

        - service: system_log.write
          data:
            level: info
            logger: solarflow_grid_control
            message: >
              "STEP100 IDLE: grid={{ grid }}W, soc={{ soc }}%, trigger={{ trigger.id }}"

